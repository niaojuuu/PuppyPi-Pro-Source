# 企业微信自建应用回调 — 微信控制 PuppyPi 配置
# 字段全部必填（除 allowed_users 外）。
#
# 获取位置：
#   corpid       : 我的企业 → 企业信息 → CorpID
#   corp_secret  : 自建应用 → 应用 Secret
#   agent_id     : 自建应用 → AgentId
#   token        : 自建应用 → 接收消息 → API 接收消息 → 设置 API 接收 → Token
#   aes_key      : 自建应用 → 接收消息 → API 接收消息 → EncodingAESKey (43字符)
#
# 公网回调 URL（必须 HTTPS）：
#   推荐 Tailscale Funnel：tailscale funnel 8088 on
#   拿到的 https://<node>.ts.net/wecom/callback 填到企业微信后台。
#
# 启动命令：
#   rosrun puppy_extend_demo wechat_interaction_cloud_ai.py \
#     --config /home/ubuntu/puppypi/src/puppy_extend_demo/config/wechat_config.yaml

wework:
  corp_id: "ww592b0eb99f890bc4"
  corp_secret: "HJzMs7lRclj26CiBuNc1cJ6zP600oGGZGYcBPGcDbYk"
  agent_id: "1000065"
  token: "puppyctrl2026dog"
  aes_key: "16ybcsW8OZMsEHDWPJciT7fuofCdPpezZ0GhsZUu5I8"
